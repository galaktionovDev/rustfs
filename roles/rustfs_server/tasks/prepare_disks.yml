---
- name: Проверить наличие обязательного контракта дисков
  ansible.builtin.assert:
    that:
      - not (rustfs_require_storage_disks | default(false) | bool) or storage_disks is defined
    fail_msg: "В inventory отсутствует список storage_disks для узла хранения"

- name: Подготовить явно назначенные диски
  ansible.builtin.include_tasks: prepare_storage_disks.yml
  when: storage_disks is defined

- name: Сформировать каталоги данных для прежнего контракта
  ansible.builtin.set_fact:
    rustfs_server_datadirs: "{{ rustfs_extra_disks | map(attribute='mount') | list }}"
  when:
    - storage_disks is not defined
    - (rustfs_extra_disks | default([])) | length > 0
  changed_when: false

- name: Выполнить прежний сценарий для старых вызовов
  ansible.builtin.include_tasks: prepare_disks_legacy.yml
  when:
    - storage_disks is not defined
    - not (rustfs_require_storage_disks | default(false) | bool)
